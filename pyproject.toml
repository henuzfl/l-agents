[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-agent"
version = "0.1.0"
description = "Minimal stateful manager and stateless sub-agent skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "llama-index-core>=0.14.24,<0.15",
  "llama-index-embeddings-openai>=0.6,<0.7",
  "llama-index-vector-stores-postgres>=0.8.1,<0.9",
  "minio>=7.2,<8",
  "openai-agents>=0.2,<1",
  "pypdf>=5.0,<7",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.2,<1",
  "pyjwt>=2.10,<3",
  "psycopg2-binary>=2.9,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "pymupdf4llm>=0.2,<1",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.18,<1",
  "tiktoken>=0.8,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
