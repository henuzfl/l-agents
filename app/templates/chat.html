<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f5">
    <title>Agent Desk</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2320211f'/%3E%3Cpath d='M18 18h12v12H18zm16 0h12v12H34zM18 34h12v12H18zm16 0h12v12H34z' fill='%236ed2cb'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/knowledge.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/markdown.css') }}?v=20260830.1">
    <link rel="stylesheet" href="{{ url_for('static', path='/trace.css') }}">
  </head>
  <body>
    <div class="shell">
      <button id="menuButton" class="mobile-menu" aria-label="打开历史对话"><span></span><span></span></button>
      <div id="scrim" class="scrim" hidden></div>

      <aside id="sidebar" class="sidebar">
        <div class="brand"><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div><span>Agent Desk</span></div>
        <button id="newChatButton" class="new-chat"><span class="plus">＋</span><span>新建对话</span><kbd>Ctrl K</kbd></button>
        <nav class="main-nav" aria-label="主菜单">
          <a class="main-nav-link active" href="/"><span>◌</span>对话</a>
          <a class="main-nav-link" href="/knowledge"><span>◇</span>知识库</a>
        </nav>
        <div class="history-label">最近对话</div>
        <nav id="history" class="history" aria-label="历史对话"></nav>
        <div class="sidebar-footer">
          <div class="status"><span></span><div><strong>DeepSeek</strong><small>API 连接模式</small></div></div>
          <button class="avatar" type="button" data-logout title="退出登录" style="border:0;cursor:pointer">退出</button>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <button class="model-pill" type="button">manager <span>⌄</span></button>
          <div class="memory-state"><span class="live-dot"></span>会话记忆已开启</div>
        </header>

        <section id="conversation" class="conversation" aria-live="polite"></section>

        <footer class="composer-wrap">
          <div id="errorBanner" class="error-banner" role="alert" hidden><span>!</span><b id="errorText"></b></div>
          <div class="composer">
            <textarea id="messageInput" rows="1" aria-label="消息" placeholder="给 Manager 发送消息…"></textarea>
            <div class="composer-meta"><kbd>Enter</kbd> 发送 · <kbd>Shift Enter</kbd> 换行</div>
            <button id="sendButton" class="send" disabled aria-label="发送消息">↑</button>
          </div>
          <p class="disclaimer">Agent 可能会产生不准确的信息，请核验重要内容。</p>
        </footer>
      </main>
    </div>

    <template id="welcomeTemplate">
      <div class="welcome">
        <div class="orbit" aria-hidden="true"><span></span><span></span><span></span><span></span><b>m</b></div>
        <p class="eyebrow">多 Agent 工作台</p>
        <h1>今天想让谁<br><em>加入对话？</em></h1>
        <p class="intro">直接指定一个或多个 Agent。Manager 会保留当前会话，并汇总它们的返回结果。</p>
        <div class="suggestions">
          <button data-message="请调用知识检索 Agent"><span>知识检索 Agent</span><small>查询已上传文档</small><b>↗</b></button>
          {% for agent in ["agent2", "agent3", "agent4"] %}
          <button data-message="请调用{{ agent }}"><span>{{ agent }}</span><small>调用固定回复</small><b>↗</b></button>
          {% endfor %}
        </div>
      </div>
    </template>
    <script src="{{ url_for('static', path='/auth.js') }}" defer></script>
    <script src="{{ url_for('static', path='/chat.js') }}?v=20260830.1" defer></script>
  </body>
</html>
